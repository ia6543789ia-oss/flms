<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlay - Player e Explicação</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Cabeçalho / Banner -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-circle-play"></i>
            <span>Teste seu poder / Test your might</span>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Pesquisar vídeos...">
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">

        <!-- Área da Biblioteca de Vídeos -->
        <section id="catalogSection" class="catalog-section">
            <h1 class="section-title">Vídeos Disponíveis</h1>
            <div id="videoGrid" class="video-grid">
                <!-- Os cards de vídeo serão gerados dinamicamente via JS -->
            </div>
        </section>

    </main>

    <!-- Arquivo JS Externo -->
    <script src="script.js"></script>
</body>
</html>
